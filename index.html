<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3ee">
<title>5 דקות לאתר שלך · Next Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Lexend:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== צבעים: מותג Next Point (60 נייר · 30 שחור וקווים · 10 ירוק רק על הכפתור הראשי) ===== */
:root{--paper:#f4f3ee;--card:#fff;--ink:#111;--mut:#5c5a54;--line:#dcd9d0;--green:#c8f03c;--gtext:#4f6b00;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:16px 18px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.logo{direction:ltr;display:inline-flex;align-items:center;gap:8px;font:500 15px Lexend,Heebo,sans-serif;color:var(--ink);text-decoration:none}
.mark{display:inline-flex;align-items:center;background:var(--ink);border-radius:20px;padding:6px 8px;gap:0}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--paper);display:block}
.mark b{width:14px;height:2px;background:var(--paper);display:block}
.mark i+b+i{background:var(--green)}
.step{font-size:14px;color:var(--mut);font-weight:500}
h1{font-size:30px;line-height:1.2;margin:6px 0 12px;font-weight:800}
h2{font-size:26px;line-height:1.2;margin:2px 0 6px;font-weight:800}
p{font-size:17px;line-height:1.6;margin:0 0 14px}
.mut{color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:18px 0}
.box strong{display:block;font-size:18px;margin-bottom:4px}
.shot{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0f1012;margin:14px 0 6px}
.shot .in{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shot img{display:block;width:100%;height:auto}
.zoom{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(17,17,17,.82);color:#fff;border:0;border-radius:20px;padding:7px 12px;font:500 14px Heebo,sans-serif;cursor:pointer}
.hint{font-size:14px;color:var(--mut);margin:0 0 16px}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:700;font-size:17px;margin-bottom:10px;padding:0}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;font-size:16px;line-height:1.45;min-height:52px}
.opt input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ok{font-weight:700}
textarea,input[type=text]{width:100%;font:16px Heebo,sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);resize:vertical}
textarea{min-height:84px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
.other{margin:-2px 0 10px}
.bar{position:fixed;inset-inline:0;bottom:0;background:rgba(244,243,238,.96);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:52px;border-radius:12px;border:0;font:700 17px Heebo,sans-serif;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--green)}
.btn.sec{flex:none;background:transparent;border:1.5px solid var(--line);padding:0 16px;font-weight:500}
a.link{color:var(--ink);font-weight:500}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.item b{font-size:17px}
.pill{font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.have{color:var(--mut);border:1px solid var(--line)}
.pill.miss{color:#8a2a00;border:1px solid #8a2a00}
.keep{font-size:14px;color:var(--mut);margin:6px 0 0}
details{margin:14px 0}
summary{cursor:pointer;font-weight:700}
pre{white-space:pre-wrap;font:15px/1.6 Heebo,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 0}
iframe{width:100%;border:0;min-height:420px}
.lb{position:fixed;inset:0;background:#0f1012;z-index:9;overflow-y:auto;display:none}
.lb.on{display:block}
.lb img{display:block;width:100%;max-width:520px;margin:0 auto}
.lb button{position:fixed;top:12px;inset-inline-end:12px;z-index:2;background:#fff;color:#111;border:0;border-radius:20px;padding:9px 16px;font:700 15px Heebo,sans-serif}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
/* ===== פתיחה: "האתר שלך מתחבר". מהירות: --d בין חלק לחלק. מרחק תנועה: translateY ב-@keyframes drop ===== */
.build{--d:.32s;width:178px;margin:4px auto 20px;border:2px solid var(--ink);border-radius:26px;padding:10px 8px 12px;background:var(--card)}
.build .notch{width:46px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 8px}
.build .sl{position:relative;height:56px;border-radius:8px;margin-bottom:5px;background:#0f1012 50% 0/100% auto no-repeat;animation:drop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*var(--d))}
.build .sl i{position:absolute;inset-inline-start:5px;bottom:5px;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--ink);font:700 10px/16px Heebo;text-align:center;font-style:normal;animation:pop .3s ease both;animation-delay:calc(var(--i)*var(--d) + .35s)}
.build .you{height:50px;border:1.5px dashed var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1.2;text-align:center;animation:fade .5s ease both;animation-delay:calc(var(--n)*var(--d) + .35s)}
.build.still *{animation:none!important}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.build *{animation:none!important}}
.steps{font-size:15px;font-weight:500;color:var(--mut);margin:-4px 0 14px}
/* ===== מסך הלוגו (פעם אחת, כ-2.6 שניות, לחיצה מדלגת). מהירות: --t. ===== */
.splash{--t:1;position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.splash.out{transform:translateY(-100%)}
.splash .lg{direction:ltr;position:relative;width:176px;height:26px;margin-bottom:18px}
.splash .d1,.splash .d2{position:absolute;top:2px;width:22px;height:22px;border-radius:50%}
.splash .d1{left:0;background:var(--paper);animation:pop .35s ease both calc(.1s*var(--t))}
.splash .d2{right:0;background:var(--green);animation:pop .35s ease both calc(.95s*var(--t))}
.splash .d2::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);animation:ring .9s ease-out both calc(1s*var(--t))}
.splash .ln{position:absolute;left:16px;right:16px;top:12px;height:2px;background:var(--paper);transform-origin:left;animation:draw .55s cubic-bezier(.6,0,.2,1) both calc(.35s*var(--t))}
.splash .nm{direction:ltr;font:500 26px Lexend,Heebo,sans-serif;letter-spacing:.02em;animation:up .5s ease both calc(1.05s*var(--t))}
.splash .ok{margin-top:40px;font-size:38px;font-weight:800;position:relative;padding-bottom:8px;animation:up .5s ease both calc(1.4s*var(--t))}
.splash .ok::after{content:"";position:absolute;right:0;left:0;bottom:0;height:2px;background:var(--paper);transform-origin:right;animation:draw .5s cubic-bezier(.6,0,.2,1) both calc(1.75s*var(--t))}
.splash .nx{margin-top:12px;font-size:20px;color:#bdbab2;animation:up .5s ease both calc(1.85s*var(--t))}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
.build.wait *{animation-play-state:paused!important}
/* ===== מסך חלק: "התמונה עוקבת אחרי הבחירה". מהירות המעבר: transition ב-.pan ===== */
.win{position:relative;height:clamp(220px,38vh,340px);overflow:hidden;border-radius:var(--r);background:#0f1012;margin:12px 0 4px;border:1px solid var(--line)}
.pan{position:absolute;inset-inline:0;top:0;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.pan img{display:block;width:100%;height:auto}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#fff;color:#111;font:800 14px/28px Heebo,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 3px rgba(17,17,17,.6);transition:transform .25s,box-shadow .25s;pointer-events:none}
.mk.hot{transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 0 3px #111,0 0 0 6px #fff}
.full{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(17,17,17,.85);color:#fff;border:0;border-radius:20px;padding:8px 13px;font:500 14px Heebo,system-ui,sans-serif;cursor:pointer}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font:800 13px/24px Heebo,system-ui,sans-serif;text-align:center;margin-top:-1px}
.lb .simg{position:relative;max-width:520px;margin:0 auto}
/* ===== כתיבה: חלון צמוד למעלה כדי שהמקלדת לא תסתיר ===== */
body.typing #bar{display:none}
.writer{position:fixed;inset-inline:0;top:0;z-index:15;background:var(--paper);padding:14px 18px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:520px;margin:0 auto}
.writer b{display:block;font-size:18px;margin-bottom:4px}
.writer textarea{min-height:110px;margin:8px 0 10px}
.writer .row{display:flex;gap:10px}
.wshade{position:fixed;inset:0;z-index:14;background:rgba(17,17,17,.45)}
.item{display:block;width:100%;text-align:start;font:inherit;color:inherit}
.item .top{display:flex}
button.item{cursor:pointer}
.item .val{display:block;font-size:16px;margin-top:4px}
.item .keep{display:block}
.item .add{display:inline-block;margin-top:8px;font-weight:700;font-size:15px;text-decoration:underline}
.pill.done{color:var(--ink);border:1px solid var(--ink)}
.fu{margin:-4px 0 12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 12px 12px}
.ob:has(.fu:not([hidden])) .opt{border-radius:12px 12px 0 0;margin-bottom:0}
.fq{font-weight:700;font-size:15px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px Heebo,system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:9px 14px;cursor:pointer;text-align:start;line-height:1.35;min-height:42px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips .said,.fu .said{flex-basis:100%;margin:4px 0 0;font-size:15px;cursor:pointer}
.fwarn{color:#8a2a00;font-weight:700;font-size:14px;margin:8px 0 0}
.cf b{display:block;font-size:17px;margin-bottom:8px;line-height:1.45}
.cf .keep{margin:-4px 0 8px}
.fl{margin:6px 0;padding-inline-start:20px;font-size:16px;line-height:1.7}
.looks{display:flex;gap:8px;margin:0 0 10px}
.look{flex:1 1 0;min-width:0;border:2px solid var(--line);border-radius:14px;padding:0;background:var(--card);overflow:hidden;cursor:pointer;font:700 15px Heebo,system-ui,sans-serif;color:var(--ink)}
.look img{display:block;width:100%;height:auto}
.look span{display:block;padding:8px 4px;font-size:14px;line-height:1.3}
.look.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.look.on span::before{content:"✓ "}
.fc{display:flex;gap:12px;align-items:flex-start}
.before{flex:none;width:92px;text-align:center;font-size:12px;color:var(--mut)}
.bimg{width:92px;height:92px;border-radius:10px;background:#0f1012 50% 0/100% auto no-repeat;border:1px solid var(--line);margin-bottom:3px}
.bimg.new{background:var(--paper);border:1.5px dashed var(--mut);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:14px}
.ftx{flex:1;min-width:0}
.ftx b{display:block;font-size:17px;line-height:1.4}
.spec{display:block;font-size:15px;margin-top:4px}
.vtag{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;border:1px solid var(--ink);border-radius:12px;padding:2px 9px}
.nofile{display:block;margin-top:8px;background:none;border:0;padding:0;font:14px Heebo,system-ui,sans-serif;color:var(--mut);text-decoration:underline;cursor:pointer}
.btn.wide{width:100%;margin-top:8px;text-decoration:none}
.revb{width:100%;background:var(--ink);color:#fff;margin:4px 0 16px;gap:10px;font-size:17px}
.revb .ico{font-size:18px}
.rv{position:fixed;inset:0;z-index:16;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.rv-top{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);max-width:520px;margin:0 auto}
.rv-top h2{margin:0}
.rv-top .btn{flex:none;min-height:44px}
.rv-in{max-width:520px;margin:0 auto;padding:6px 18px 40px}
.rv-t{font-size:15px;color:var(--mut);margin:20px 0 8px;font-weight:700}
.rv-g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rv-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.rv-h b{font-size:17px}
.rv-e{flex:none;background:none;border:1.5px solid var(--line);border-radius:18px;padding:6px 13px;font:700 14px Heebo,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.rv-l{font-size:15px;line-height:1.55;margin:6px 0 0}
.rv-a{font-weight:700}
.rv-m{color:var(--mut);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opt .said{display:block;font-size:14px;color:var(--mut);margin-top:3px;font-style:normal}
.opt .edit{font-size:14px;text-decoration:underline;margin-inline-start:4px}
@media (prefers-reduced-motion:reduce){.pan{transition:none}}
.done-ico{font-size:40px;margin:10px 0 0;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo" aria-label="Next Point"><span class="mark" aria-hidden="true"><i></i><b></b><i></i></span>Next Point</span>
    <span class="step" id="stepTxt" aria-live="polite"></span>
  </header>
  <main id="app"></main>
</div>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<div class="splash" id="splash" hidden aria-hidden="true"><div class="lg"><span class="ln"></span><span class="d1"></span><span class="d2"></span></div><div class="nm">Next Point</div><div class="ok">בחרת נכון.</div><div class="nx">עכשיו מסיימים.</div></div>
<div class="lb" id="lb" role="dialog" aria-label="החלק בגודל מלא"><button type="button" id="lbX">סגירה</button><div id="lbBox"></div></div>
<noscript><p style="padding:20px">צריך להפעיל JavaScript כדי לענות על השאלון.</p></noscript>

<script>
// ===== קובץ הנתונים של הלקוח. לכל לקוח משנים רק את הקובץ הזה ואת התמונות בתיקיית shots =====
window.CLIENT = {
  id: "ido-sagiv",                 // מזהה קצר באנגלית (משמש לשמירה בטלפון ול-Tally)
  name: "עידו",                     // שם פרטי, מופיע בברכה
  you: "m",                         // לשון פנייה: m = זכר, f = נקבה
  sketchUrl: "https://ofirkingmessi-star.github.io/ido-sagiv-site23/",
  deadline: "יום שני, 16.11",     // התאריך שבו האתר עולה. לעדכן לפני ששולחים!
  minutes: "5–10",
  introShots: [0, 2, 3, 5],         // אילו חלקים מופיעים בפתיחה (לפי הסדר ברשימה, מתחילים מ-0)

  // לאן הלקוח שולח "סיימתי". אם ownerWa ריק, נפתחת הודעה באינסטגרם וההודעה מועתקת.
  ownerWa: "",                      // למשל "9725XXXXXXXX" (בלי + ובלי מקפים)
  ownerIg: "nextpoint.glazer2",

  // הטופס של Tally (להעלאת קבצים). ריק = שלב ההעלאה מוצג בלי טופס.
  tallyId: "bZj6Yo",                      // החלק האחרון בקישור של הטופס, למשל "wAbc12"
  web3key: "03c44ff4-427f-40fc-8985-3f71aa86fee1",                      // מפתח Web3Forms: כל התשובות במלואן מגיעות אליך במייל. ריק = התשובות נשלחות בקיצור דרך Tally
  dropbox: "https://www.dropbox.com/request/8a329bwhdfqcsja95tsc",                      // קישור File Request של Dropbox לסרטונים. ריק = הסרטון נשלח בהודעה

  // pos = איזה גובה בצילום רואים בתמונה הקטנה בפתיחה (0% = למעלה).
  // view = איזה גובה בחלק רואים כשהמסך נפתח (אחוז מלמעלה).
  // at = איפה הסימון של ההצעה על התמונה: [אחוז משמאל, אחוז מלמעלה].
  // ask = מה שואלים אחרי שמסמנים את ההצעה ("מה במקום"):
  //   type: "text" (ניסוחים מוצעים ב-sug + כתיבה), "file" (קובץ; what = השם שלו ברשימה, spec = שורה אחת איך הוא צריך להיות,
  //   video: true = סרטון, עולה ב-Dropbox), ph = טקסט עזר בחלון הכתיבה.

          opts: ["הסיפור בסרטון (כמו עכשיו)", "הסדנה והליווי", "מה אומרים עליי"] },
        { id: "insp", kind: "single", q: "יש אתר או חשבון שאתה אוהב את הסגנון שלו?", opts: ["אין"],
          write: "אדביק קישור", ph: "קישור לאתר או לחשבון אינסטגרם" }
      ] }
  ],

  // משהו להוסיף לאתר (דברים שאין בסקיצה). אותו מבנה כמו הצעות.
  addons: [
    { t: "שאלות נפוצות", ask: { q: "מה שואלים אותך הכי הרבה?", ph: "2–3 שאלות, ואם אפשר גם את התשובות" } },
    { t: "עמוד להזמנת הרצאה (לבתי ספר וקבוצות)", ask: { q: "למי אתה מרצה, ועל מה?", ph: "למשל: כיתות ט'–י\"ב, הרצאה של שעה על ביטחון עצמי" } },
    { t: "גלריה מהסדנאות וההרצאות", ask: { q: "איך התמונות מגיעות?", type: "file", what: "תמונות לגלריה", spec: "6–9 תמונות מהסדנאות וההרצאות" } },
    { t: "סרטון המלצה של משתתף", ask: { q: "איך הסרטון מגיע?", type: "file", what: "סרטון המלצה", video: true, spec: "עד דקה, צולם לאורך" } }
  ],

  // רק לוודא: כל הנחה מהקובץ של הלקוח. חובה לענות. yes/no = הכיתוב בכפתורים. noWrite = "לא" בלי כתיבה.
  confirm: [
    { q: "הסדנה „לחיות בעוצמה” מיועדת לגברים בגילאי 16–21." },
    { q: "הסדנה: 4 מפגשים של כשעתיים, עד 10 משתתפים." },
    { q: "הסדנה מתקיימת במרכז תל אביב, ליד עזריאלי." },
    { q: "ההרצאות שלך הן באודיטוריום ובכיתות." },
    { q: "הבחור הבלונדיני בתמונה מהבמה הוא אתה." },
    { q: "מותר להראות באתר את תמונת האולם עם הקהל (בני נוער).", yes: "כן, יש אישור", no: "לא, לטשטש את הקהל", noWrite: true },
    { q: "מותר להציג את ההודעות של המשתתפים, בלי שמות.", yes: "כן, מותר", no: "לא, להוריד אותן", noWrite: true },
    { q: "מספר הוואטסאפ באתר: 053-463-9946.", ask: "מה המספר הנכון?" }
  ],

  // מה חסר לי כדי לסיים. type text = שאלה (חובה). sug = תשובות בלחיצה. type file = מצאתי באינסטגרם (רק מידע).
  need: [
    { label: "מחיר הסדנה", type: "text", sug: ["להשאיר „מחיר בשיחה”"], ph: "למשל: 450 ₪ לכל הסדנה" },
    { label: "מתי המחזור הבא?", type: "text", sug: ["עוד לא נקבע"], ph: "תאריך פתיחה" },
    { label: "כתובת משלך לאתר (כמו idosagiv.co.il)?", type: "text", hint: "עולה כסף כל שנה, ורשומה על שמך. לא חובה.",
      sug: ["לא צריך, הכתובת החינמית מספיקה", "כן, אשמח לשמוע פרטים"], btn: "יש לי כבר כתובת", ph: "הכתובת שיש לך" },
    { label: "תמונות שלך", type: "file" },
    { label: "תמונות מהסדנה", type: "file" },
    { label: "10 הודעות מהסטורי", type: "file" }
  ]
};

</script>
<script>
(function(){
const C=window.CLIENT;if(!C){document.getElementById('app').innerHTML='<p>משהו לא נטען. תרענן את הדף, ואם זה חוזר תשלח לי הודעה.</p>';return}
const S=C.sections, N=C.need;
const g=(m,f)=>C.you==='f'?f:m;           // לשון פנייה
const KEY='np-q2-'+C.id;
const OK='מושלם, להשאיר';
const CF=C.confirm||[], AD=C.addons||[];
const STEPS_N=()=>1+S.length+(C.design||[]).length+(AD.length?1:0)+(CF.length?1:0)+4;
const blank=()=>({sel:[],other:'',ans:{}});
// ===== שמירה בטלפון של הלקוח (localStorage) =====
let st={step:0,des:{},sec:S.map(blank),add:blank(),conf:CF.map(()=>({v:'',t:''})),need:N.map(()=>({pick:'',text:''})),sent:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')st=Object.assign(st,s)}catch(e){}
// משלים תשובות שנשמרו בגרסה קודמת של השאלון, כדי ששינוי במבנה לא ישבור לקוח שחוזר
(function fix(){const o=(x,d)=>Object.assign(d,x&&typeof x==='object'&&!Array.isArray(x)?x:{});
  const arr=x=>Array.isArray(x)?x:[];
  const sb=x=>{const b=o(x,blank());b.sel=arr(b.sel);b.ans=b.ans&&typeof b.ans==='object'?b.ans:{};b.other=String(b.other||'');return b};
  st.sec=S.map((_,i)=>sb(arr(st.sec)[i]));st.add=sb(st.add);
  st.conf=CF.map((_,i)=>o(arr(st.conf)[i],{v:'',t:''}));
  st.need=N.map((_,i)=>o(arr(st.need)[i],{pick:'',text:''}));
  st.des=st.des&&typeof st.des==='object'?st.des:{};
  Object.values(st.des).forEach(x=>{if(x&&typeof x==='object')x.many=arr(x.many)});
  st.step=Math.max(0,Math.min(+st.step||0,STEPS_N()-1));
})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

// סדר השלבים: פתיחה, חלק אחרי חלק, להוסיף, רק לוודא, מה חסר, קבצים ושליחה, סיום
const DS=C.design||[];
const STEPS=['intro',...S.map((_,i)=>'s'+i),...DS.map((_,i)=>'d'+i),...(AD.length?['add']:[]),...(CF.length?['conf']:[]),'need','files','send','done'];
const app=document.getElementById('app'),barIn=document.getElementById('barIn'),stepTxt=document.getElementById('stepTxt');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// מספרים וטווחים תמיד משמאל לימין (טלפון, 16–21, שעות)
const nb=t=>esc(t).replace(/\d[\d\-–:./]*\d/g,m=>`<span dir="ltr">${m}</span>`);
const OPS=list=>list.map(o=>typeof o==='string'?{t:o}:o);
const ansOf=(a,o)=>a.ans[o.t]||(a.ans[o.t]={pick:'',text:''});
const answered=x=>!!((x.pick||'').trim()||(x.text||'').trim());
// תשובה אחת בשפה פשוטה
function ansTxt(o,x){if(x.text&&x.text.trim())return '„'+x.text.trim()+'”';
  if(x.pick==='file')return 'יעלה קובץ: '+((o.ask&&o.ask.what)||'קובץ');
  if(x.pick==='ig')return 'לבחור מהאינסטגרם שלו';return x.pick||'(לא ענה)'}
// כל הקבצים שהלקוח אמר שיעלה
function files(){const F=[];
  st.sec.forEach((a,i)=>OPS(S[i].opts).forEach(o=>{if(a.sel.includes(o.t)&&ansOf(a,o).pick==='file')
    F.push({name:(o.ask&&o.ask.what)||o.t,spec:(o.ask&&o.ask.spec)||'',video:!!(o.ask&&o.ask.video),where:S[i].title,shot:S[i].shot,y:o.at?o.at[1]:(S[i].view||0),step:1+i})}));
  OPS(AD).forEach(o=>{if(st.add.sel.includes(o.t)&&ansOf(st.add,o).pick==='file')
    F.push({name:(o.ask&&o.ask.what)||o.t,spec:(o.ask&&o.ask.spec)||'',video:!!(o.ask&&o.ask.video),where:'חדש באתר: '+o.t,step:STEPS.indexOf('add')})});
  return F}
function block(title,a,OP,okWord){const L=[];const ch=OP.filter(o=>a.sel.includes(o.t));
  if(!ch.length&&!a.other.trim()){L.push('• '+title+': '+(a.sel.includes(OK)?okWord:'(לא ענה, נשאר כמו בסקיצה)'));return L}
  L.push('• '+title+':');ch.forEach(o=>L.push('   – '+o.t+' ← '+ansTxt(o,ansOf(a,o))));
  if(a.other.trim())L.push('   – אחר: '+a.other.trim());return L}
// ===== הסיכום שנשלח אליך (ל-Tally ולהודעה) =====
// ===== התשובות מחולקות לקבוצות: כל קבוצה היא שדה נפרד במייל, כדי שיהיה קל לקרוא =====
function groups(){
  const G={},P=[];
  S.forEach((s,i)=>{const L=block(s.title,st.sec[i],OPS(s.opts),'מושלם');P.push(...L)});
  G['1. החלקים']=P.join('\n');
  if(DS.length){const D=[];DS.forEach(d=>d.items.forEach(q=>{if(q.when&&!when(q))return;const x=st.des[q.id]||{};
    const t=(x.text||'').trim()?'„'+x.text.trim()+'”':(x.many&&x.many.length?x.many.join(', '):x.pick||'(לא ענה)');D.push('• '+q.q+' '+t)}));G['2. עיצוב']=D.join('\n')}
  if(AD.length)G['3. להוסיף לאתר']=block('להוסיף',st.add,OPS(AD),'לא צריך').join('\n');
  if(CF.length)G['4. רק לוודא']=CF.map((c,i)=>{const x=st.conf[i];
    return '• '+(x.v==='yes'?'✓ ':x.v==='no'?'✗ ':'? ')+c.q+(x.v==='no'&&x.t.trim()?' ← „'+x.t.trim()+'”':x.v==='no'?' ← '+(c.no||'לא'):'')}).join('\n');
  G['5. פרטים']=N.map((n,i)=>[n,i]).filter(([n])=>n.type==='text').map(([n,i])=>'• '+n.label+': '+ansTxt(n,st.need[i])).join('\n');
  const F=files();G['6. קבצים']=F.length?F.map((f,i)=>'• '+(i+1)+'. '+f.name+' ('+f.where+')'+(f.video?' · סרטון, '+(C.dropbox?'ב-Dropbox':'בהודעה'):' · ב-Tally')).join('\n'):'אין';
  return G}
function summary(){const G=groups();return [C.name+' · '+C.id].concat(Object.entries(G).map(([k,v])=>'\n['+k.replace(/^\d\. /,'')+']\n'+v)).join('\n')}

// חלון כתיבה צמוד למעלה. onSave מקבל את הטקסט
function writer(title,val,onSave,ph){
  if(document.querySelector('.writer'))return;
  const sh=document.createElement('div');sh.className='wshade';
  const w=document.createElement('div');w.className='writer';w.setAttribute('role','dialog');w.setAttribute('aria-label',title);
  w.innerHTML=`<b>${esc(title)}</b><span class="hint">${g('תכתוב','תכתבי')} במילים שלך, גם משפט אחד מספיק.</span>
    <textarea maxlength="400" aria-label="${esc(title)}" placeholder="${esc(ph||'')}">${esc(val||'')}</textarea>
    <div class="row"><button type="button" class="btn main" data-a="s">שמירה</button><button type="button" class="btn sec" data-a="c">${val?'מחיקה':'ביטול'}</button></div>`;
  document.body.append(sh,w);const ta=w.querySelector('textarea');
  const done=t=>{sh.remove();w.remove();document.body.classList.remove('typing');if(t!==null)onSave(t)};
  w.querySelector('[data-a=s]').onclick=()=>done(ta.value.trim());
  w.querySelector('[data-a=c]').onclick=()=>done(val?'':null);sh.onclick=()=>done(null);
  ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length);setTimeout(()=>scrollTo(0,0),50);
}
// בזמן כתיבה: הכפתורים התחתונים נעלמים והשדה עובר לאמצע המסך
addEventListener('focusin',e=>{if(e.target.matches('textarea,input[type=text]')){document.body.classList.add('typing');
  if(!e.target.closest('.writer'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)}});
addEventListener('focusout',e=>{if(e.target.matches('textarea,input[type=text]'))setTimeout(()=>{if(!document.activeElement.matches('textarea,input[type=text]'))document.body.classList.remove('typing')},100)});
// ===== הצעה + שאלת "מה במקום" שנפתחת מתחתיה =====
function chips(o,x){const k=(o.ask&&o.ask.type)||'text',sug=(o.ask&&o.ask.sug)||[];let h='';
  if(k==='file'){h+=chip('file','אעלה '+((o.ask&&o.ask.what)||'קובץ')+' בסוף',x.pick==='file')+chip('w','יש באינסטגרם: אדביק קישור',!!(x.text||'').trim())+chip('ig','תבחר אתה מהאינסטגרם שלי',x.pick==='ig')}
  else{sug.forEach(t=>h+=chip('p',t,x.pick===t));h+=chip('w','✎ '+(sug.length?'משהו אחר':(o.ask&&o.ask.btn)||g('אכתוב','אכתוב')+' כאן'),!!(x.text||'').trim())}
  if((x.text||'').trim())h+=`<p class="said">„${esc(x.text.trim())}” <span class="edit">עריכה</span></p>`;
  return h}
function chip(kind,t,on){return `<button type="button" class="chip${on?' on':''}" data-k="${kind}" data-v="${esc(t)}" aria-pressed="${on}">${nb(t)}</button>`}
function optList(v,OP,a,onUpd,onHot){
  const box=v.querySelector('.olist');
  box.innerHTML=OP.map((o,j)=>`<div class="ob" data-j="${j}"><label class="opt"><input type="checkbox" ${a.sel.includes(o.t)?'checked':''}>${o.at?`<b class="num">${j+1}</b>`:''}<span>${nb(o.t)}</span></label>
    <div class="fu" ${a.sel.includes(o.t)?'':'hidden'}><p class="fq">${nb((o.ask&&o.ask.q)||'מה במקום?')}</p><div class="chips"></div><p class="fwarn" hidden>${g('תבחר','תבחרי')} תשובה כדי שאוכל לעשות את השינוי.</p></div></div>`).join('')+
    `<div class="ob"><label class="opt oth"><input type="checkbox" ${a.other.trim()?'checked':''}><span>אחר: ${g('אכתוב','אכתוב')} בעצמי<i class="said"></i></span></label></div>`;
  const draw=(ob,o)=>{const x=ansOf(a,o),c=ob.querySelector('.chips');c.innerHTML=chips(o,x);
    c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
      if(k==='w')writer((o.ask&&o.ask.q)||'מה במקום?',x.text,t=>{x.text=t;if(t)x.pick='';save();draw(ob,o);onUpd()},(o.ask&&o.ask.ph)||'');
      else{x.pick=x.pick===b.dataset.v||x.pick===k&&k!=='p'?'':(k==='p'?b.dataset.v:k);x.text='';save();draw(ob,o);onUpd()}
      ob.querySelector('.fwarn').hidden=true})};
  box.querySelectorAll('.ob[data-j]').forEach(ob=>{const j=+ob.dataset.j,o=OP[j],cb=ob.querySelector('input'),fu=ob.querySelector('.fu');
    draw(ob,o);
    cb.onchange=()=>{a.sel=a.sel.filter(t=>t!==OK&&t!==o.t);if(cb.checked)a.sel.push(o.t);fu.hidden=!cb.checked;save();onUpd();if(cb.checked){onHot&&onHot(j);setTimeout(()=>fu.scrollIntoView({block:'nearest',behavior:'smooth'}),60)}};
    ob.querySelector('label').addEventListener('pointerenter',()=>onHot&&onHot(j))});
  const ol=box.querySelector('.oth'),oc=ol.querySelector('input'),said=ol.querySelector('.said');
  const showO=()=>{oc.checked=!!a.other.trim();said.innerHTML=a.other.trim()?'„'+esc(a.other.trim())+'” <span class="edit">עריכה</span>':''};showO();
  oc.onclick=e=>{e.preventDefault();writer('מה עוד?',a.other,t=>{a.other=t;save();showO();onUpd()})};
}
// הצעה מסומנת בלי תשובה: מסמנים ומגללים אליה. מחזיר true אם הכול בסדר
function checkAns(v,OP,a){const j=OP.findIndex(o=>a.sel.includes(o.t)&&!answered(ansOf(a,o)));if(j<0)return true;
  const ob=v.querySelector(`.ob[data-j="${j}"]`);ob.querySelector('.fwarn').hidden=false;ob.scrollIntoView({block:'center',behavior:'smooth'});return false}
const nChg=(a,OP)=>OP.filter(o=>a.sel.includes(o.t)).length+(a.other.trim()?1:0);
// ===== שאלות עיצוב: single (בחירה אחת), multi (כמה), look (גרסאות של האתר). when = מופיע רק אם תשובה אחרת נבחרה =====
const dOf=id=>st.des[id]||(st.des[id]={pick:'',many:[],text:''});
function when(q){const [id,val]=q.when;const x=dOf(id);return x.pick===val}
const dDone=q=>{const x=dOf(q.id);return !!(x.pick||(x.text||'').trim()||(x.many||[]).length)};
function dItems(v,items){
  const box=v.querySelector('.dq');
  box.innerHTML=items.map(q=>`<div class="item cf dqi" data-id="${q.id}"><b>${nb(q.q)}</b>${q.hint?`<span class="keep">${esc(q.hint)}</span>`:''}<div class="body"></div><p class="fwarn" hidden>חסרה תשובה כאן.</p></div>`).join('');
  const draw=q=>{const el=box.querySelector(`[data-id="${q.id}"]`),x=dOf(q.id),bd=el.querySelector('.body');
    el.hidden=!!(q.when&&!when(q));let h='';
    if(q.kind==='look')h+=`<div class="looks">${q.opts.map(o=>`<button type="button" class="look${x.pick===o.t?' on':''}" data-v="${esc(o.t)}" aria-pressed="${x.pick===o.t}"><img src="${o.img}" alt="${esc(o.t)}"><span>${esc(o.t)}</span></button>`).join('')}</div><div class="chips">`;
    else h+='<div class="chips">';
    if(q.kind!=='look')q.opts.forEach(o=>{const on=q.kind==='multi'?x.many.includes(o):x.pick===o;h+=chip(q.kind==='multi'?'m':'p',o,on)});
    if(q.write)h+=chip('w','✎ '+q.write,!!(x.text||'').trim());
    h+='</div>';if((x.text||'').trim())h+=`<p class="said">„${esc(x.text.trim())}” <span class="edit">עריכה</span></p>`;
    bd.innerHTML=h;
    bd.querySelectorAll('.look').forEach(b=>b.onclick=()=>{x.pick=x.pick===b.dataset.v?'':b.dataset.v;x.text='';fin()});
    bd.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,val=b.dataset.v;
      if(k==='w')writer(q.q,x.text,t=>{x.text=t;if(t&&q.kind!=='multi')x.pick='';fin()},q.ph||'');
      else if(k==='m'){x.many=x.many.includes(val)?x.many.filter(t=>t!==val):[...x.many,val];fin()}
      else{x.pick=x.pick===val?'':val;x.text='';fin()}});
    bd.querySelectorAll('.said').forEach(p=>p.onclick=()=>writer(q.q,x.text,t=>{x.text=t;fin()},q.ph||''));
    function fin(){el.querySelector('.fwarn').hidden=true;save();items.forEach(draw);upd()}};
  let upd=()=>{};
  items.forEach(draw);
  return {left:()=>items.filter(q=>!(q.when&&!when(q))&&!q.optional&&!dDone(q)),setUpd:f=>{upd=f;f()}};
}
// ===== "מה בחרת": עמוד מסודר עם כפתור שינוי לכל חלק =====
function review(){
  const row=(title,lines,step)=>`<div class="rv-g"><div class="rv-h"><b>${nb(title)}</b>${step!=null?`<button type="button" class="rv-e" data-go="${step}">שינוי</button>`:''}</div>${lines.map(l=>`<p class="rv-l">${l}</p>`).join('')}</div>`;
  const opt=(a,OP)=>{const ch=OP.filter(o=>a.sel.includes(o.t)),L=ch.map(o=>esc(o.t)+'<br><span class="rv-a">← '+nb(ansTxt(o,ansOf(a,o)))+'</span>');
    if(a.other.trim())L.push('אחר: <span class="rv-a">„'+esc(a.other.trim())+'”</span>');return L};
  let h='<h3 class="rv-t">החלקים</h3>';

function compact(cut){
  const tx=t=>{t=String(t||'').trim();return cut&&t.length>cut?t.slice(0,cut)+'…':t};
  const at=(o,x)=>(x.text||'').trim()?'„'+tx(x.text)+'”':x.pick==='file'?'קובץ':x.pick==='ig'?'מהאינסטגרם שלו':tx(x.pick);
  const L=[C.name],ok=[];
  S.forEach((s,i)=>{const a=st.sec[i],ch=OPS(s.opts).filter(o=>a.sel.includes(o.t));
    if(!ch.length&&!a.other.trim()){ok.push(s.title);return}
    L.push('▪ '+s.title+': '+ch.map(o=>tx(o.t).slice(0,45)+' ← '+at(o,ansOf(a,o))).concat(a.other.trim()?['אחר: „'+tx(a.other)+'”']:[]).join(' | '))});
  if(ok.length)L.push('▪ מושלם: '+ok.join(', '));
  if(DS.length){const D=[];DS.forEach(d=>d.items.forEach(q=>{if(q.when&&!when(q))return;const x=dOf(q.id);
    const t=(x.text||'').trim()?'„'+tx(x.text)+'”':(x.many||[]).length?x.many.join(', '):x.pick;if(t)D.push((SHORT[q.id]||q.id)+': '+t)}));
    if(D.length)L.push('▪ עיצוב: '+D.join(' | '))}
  if(AD.length){const ch=OPS(AD).filter(o=>st.add.sel.includes(o.t));
    L.push('▪ להוסיף: '+(ch.length?ch.map(o=>o.t+' ← '+at(o,ansOf(st.add,o))).join(' | '):'לא צריך')+(st.add.other.trim()?' | אחר: „'+tx(st.add.other)+'”':''))}
  if(CF.length){const bad=CF.map((c,i)=>[c,st.conf[i]]).filter(([c,x])=>x.v!=='yes');
    L.push('▪ לוודא: '+(bad.length?bad.map(([c,x])=>'✗ '+c.q.slice(0,50)+(x.v==='no'?' ← '+((x.t||'').trim()?'„'+tx(x.t)+'”':(c.no||'לא')):' ← לא ענה')).join(' | '):'הכול נכון ✓'))}

function tallyUrl(path,extra){
  // קודם שמות הקבצים (חובה), ורק אחר כך גיבוי התשובות, בכמה שנשאר מתחת ל-7,000 תווים
  const base=new URLSearchParams(Object.assign({},extra,{client:C.id}));
  files().filter(f=>!f.video).slice(0,6).forEach((f,i)=>base.set('f'+(i+1),(i+1)+'. '+f.name+(f.spec?' ('+f.spec+')':'')));
  const head='https://tally.so/'+path+'/'+encodeURIComponent(C.tallyId)+'?'+base.toString()+'&answers=';
  const pre=C.web3key?'גיבוי מקוצר. המלא במייל נפרד "שאלון הושלם".\n':'';
  const fits=t=>head.length+encodeURIComponent(t).length<=7000;
  for(const cut of [0,300,150,80,40,15]){const t=pre+compact(cut);if(fits(t))return head+encodeURIComponent(t)}
  let t=pre+compact(15);while(t.length>20&&!fits(t+'…'))t=t.slice(0,Math.floor(t.length*.9));
  return head+encodeURIComponent(t+'…')}

    setTimeout(()=>{const r=v.querySelector('#rvb');if(r)r.onclick=openReview},0);
    if(C.tallyId){
      // שדות נסתרים: f1..f6 = שם כל קובץ, כדי שכל שדה העלאה ב-Tally יקבל את השם שלו
      const src=tallyUrl('embed',{hideTitle:'1',transparentBackground:'1',dynamicHeight:'1'}),direct=tallyUrl('r',{});
      v.innerHTML=`<h2>${F.length?'העלאת הקבצים':'שליחה'}</h2><p class="mut">${IM.length?`כל קובץ בשדה עם השם שלו. בסוף ${g('לוחצים','לוחצים')} „שליחה”.`:`${g('תלחץ','תלחצי')} „שליחה” כדי שהתשובות יגיעו אליי.`}</p>
        ${revBtn()}<div class="item ans" id="ans"><b id="ansT">שולח את התשובות…</b><span class="keep" id="ansS"></span><button type="button" class="btn sec wide" id="ansR" hidden>לנסות שוב</button><a class="btn sec wide" id="ansM" hidden href="https://ig.me/m/${esc(C.ownerIg)}" target="_blank" rel="noopener">לשלוח את התשובות באינסטגרם</a></div>${vid}<div id="tw" ${VD.length&&C.dropbox&&!st.vok?'hidden':''}><iframe data-tally-src="${esc(src)}" title="טופס העלאה" loading="lazy"></iframe>
          <p class="hint" id="tlk"><button type="button" class="nofile" id="tlb" style="margin:0">הטופס לא נטען? לפתוח אותו בחלון נפרד</button></p>
          <div class="item" id="tfb" hidden><b>הטופס נפתח בחלון נפרד</b><span class="keep">${g('תעלה','תעלי')} שם את הקבצים ${g('ותלחץ','ותלחצי')} „שליחה”, ואז ${g('תחזור','תחזרי')} לכאן.</span>
            <a class="btn main wide" id="topen" href="${esc(direct)}" target="_blank" rel="noopener">לפתוח את טופס ההעלאה ↗</a>
            <button type="button" class="btn sec wide" id="tsent" ${st.topened?'':'hidden'}>שלחתי את הטופס ✓</button></div></div>
        ${VD.length&&C.dropbox?`<p class="hint" id="twh" ${st.vok?'hidden':''}>אחרי שהסרטון עלה, יופיע כאן הטופס לשאר הקבצים.</p>`:''}`;
      // אם הטופס לא שלח "נטען" תוך 7 שניות (למשל בדפדפן שחוסם הטמעה): מסתירים אותו ומציגים כפתור לפתיחה בחלון נפרד
      const fb=()=>{const fr=v.querySelector('iframe');if(fr)fr.hidden=true;v.querySelector('#tlk').hidden=true;v.querySelector('#tfb').hidden=false};
      const watch=()=>{tallyLoaded=false;setTimeout(()=>{if(!tallyLoaded&&v.isConnected&&!v.querySelector('#tw').hidden)fb()},7000)};
      v.querySelector('#tlb').onclick=fb;
      v.querySelector('#topen').addEventListener('click',()=>{st.topened=true;save();v.querySelector('#tsent').hidden=false});
      v.querySelector('#tsent').onclick=()=>{st.sent=true;sendAnswers().finally(()=>go(st.step+1))};
      const load=()=>{const sc=document.createElement('script');sc.src='https://tally.so/widgets/embed.js';
        sc.onload=()=>{try{Tally.loadEmbeds()}catch(e){}};sc.onerror=()=>{v.querySelectorAll('iframe[data-tally-src]').forEach(f=>f.src=f.dataset.tallySrc)};document.body.appendChild(sc)};
      load();if(!v.querySelector('#tw').hidden)watch();
      // התשובות נשלחות מיד כשנכנסים לשלב. בלי קבצים: אחרי שהן נשלחו, מסיימים
      const ansUI=async()=>{const T=v.querySelector('#ansT'),S2=v.querySelector('#ansS'),R=v.querySelector('#ansR');T.textContent='שולח את התשובות…';R.hidden=true;
        const ok=await sendAnswers();if(!v.isConnected)return;
        if(ok){T.textContent='✓ התשובות נשלחו';S2.textContent=IM.length?'נשאר רק להעלות את הקבצים.':''}
        else{T.textContent='התשובות עוד לא נשלחו';S2.textContent='אפשר לנסות שוב, או לשלוח לי אותן באינסטגרם: הן יועתקו, ורק מדביקים בצ\'אט שנפתח.';R.hidden=false;v.querySelector('#ansM').hidden=false}
        return ok};
      // דרך חלופית: מעתיקים את כל התשובות ופותחים הודעה באינסטגרם, כדי שהלקוח אף פעם לא ייתקע
      v.querySelector('#ansM').addEventListener('click',()=>{const t='התשובות שלי לשאלון ('+C.name+'):\n\n'+summary();
        try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}
        st.ansManual=summary();save();v.querySelector('#ansT').textContent='✓ התשובות הועתקו';
        v.querySelector('#ansS').textContent=g('תדביק','תדביקי')+' אותן בצ\'אט באינסטגרם ו'+g('תשלח','תשלחי')+'.'+(IM.length?' אחר כך '+g('תעלה','תעלי')+' את הקבצים כאן.':'');
        v.querySelector('#ansR').hidden=true;v.querySelector('#ansM').hidden=true});
      v.querySelector('#ansR').onclick=()=>ansUI().then(ok=>{if(ok&&!IM.length&&!VD.length){st.sent=true;go(st.step+1)}});
      if(C.web3key)ansUI().then(ok=>{if(ok&&!IM.length&&!VD.length){st.sent=true;go(st.step+1)}});else v.querySelector('#ans').hidden=true;
      if(C.web3key&&!IM.length){v.querySelector('#tw').hidden=true;const h=v.querySelector('#twh');if(h)h.hidden=true}
      const vok=v.querySelector('#vok');if(vok)vok.onchange=()=>{st.vok=vok.checked;save();v.querySelector('#tw').hidden=!vok.checked;const h=v.querySelector('#twh');if(h)h.hidden=vok.checked;if(vok.checked)watch()};
      const noT=C.web3key&&!IM.length;   // בלי תמונות: לא צריך את Tally
      bar(`<button class="btn sec" id="bk">הקודם</button>${noT?'<button class="btn main" id="nx">לסיים</button>':''}`);bk.onclick=()=>go(st.step-1);
      if(noT)nx.onclick=async()=>{if(VD.length&&C.dropbox&&!st.vok){const l=v.querySelector('label:has(#vok)');if(l)l.scrollIntoView({block:'center',behavior:'smooth'});return}
        if(await ansUI()){st.sent=true;go(st.step+1)}};
    }else{
      v.innerHTML=`<h2>${F.length?'שליחת הקבצים':'שליחה'}</h2><p class="mut">לפני ששולחים, אפשר לעבור על הכול.</p>${revBtn()}${vid}
        ${IM.length?`<div class="item"><b>תמונות (${IM.length})</b><ul class="fl">${IM.map(f=>`<li>${nb(f.name)}</li>`).join('')}</ul><span class="keep">${g('תשלח','תשלחי')} לי אותן בהודעה, באותו סדר, כ„קובץ” ולא כתמונה.</span></div>`:''}
        `;
      bar(`<button class="btn sec" id="bk">הקודם</button><button class="btn main" id="nx">לסיים</button>`);
      bk.onclick=()=>go(st.step-1);nx.onclick=()=>{st.sent=true;go(st.step+1)};
    }
  }
  else if(k==='done'){stepTxt.textContent='';
    v.innerHTML=`<div class="done-ico" aria-hidden="true">✓</div><h1>תודה, ${esc(C.name)}. קיבלתי הכול.</h1>
      <p>התשובות והקבצים הגיעו אליי. אני מתחיל לעבוד על הגרסה הסופית, והאתר עולה עד ${esc(C.deadline)}.</p>
      <p class="mut">שכחת משהו? <a class="link" href="https://ig.me/m/${esc(C.ownerIg)}" target="_blank" rel="noopener">${g('תכתוב','תכתבי')} לי באינסטגרם</a></p>`;
    // חזרה לשינוי: פותח את "מה בחרת" עם כפתור שינוי לכל חלק. כשמגיעים שוב לשליחה, התשובות נשלחות כ"עדכון"
    bar(`<button class="btn sec" id="bk" style="flex:1">לחזור ולשנות תשובה</button>`);bk.onclick=openReview;
  }
}
// סיום שליחה בטופס של Tally → מסך התודה
let tallyLoaded=false;
addEventListener('message',e=>{try{const d=typeof e.data==='string'?JSON.parse(e.data):e.data;
  if(d&&d.event==='Tally.FormLoaded')tallyLoaded=true;
  if(d&&d.event==='Tally.FormSubmitted'&&STEPS[st.step]==='send'){st.sent=true;sendAnswers().finally(()=>go(st.step+1))}}catch(_){}});
// הגדלת צילום מסך
const lb=document.getElementById('lb'),lbBox=document.getElementById('lbBox'),lbX=document.getElementById('lbX');
lbX.onclick=()=>lb.classList.remove('on');addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
// ===== מסך הלוגו: רק בכניסה ראשונה, לא בהפחתת תנועה =====
let splashOn=false;
const sp=document.getElementById('splash');
const fresh=st.step===0&&!st.sec.some(x=>x.sel.length||x.other);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!(fresh&&!calm&&C.splash!==false))sp.remove();
else{splashOn=true;sp.hidden=false;
  if(C.you==='f')sp.querySelector('.ok').textContent='בחרת נכון.';
  const end=()=>{if(!splashOn)return;splashOn=false;sp.classList.add('out');
    const b=document.querySelector('.build.wait');if(b)b.classList.remove('wait');
    setTimeout(()=>sp.remove(),650)};
  sp.onclick=end;setTimeout(end,2900);
}
safe();
})();
</script>
</body>
</html>
